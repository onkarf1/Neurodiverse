[project]
name = "neurodiverse-backend"
version = "0.1.0"
description = "GoalFit backend API: checks whether learning activities practice a learner's approved IEP goal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "anyio>=4.6",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx2>=2.16,<3",
    "openai>=3.46,<4",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

# The local alembic/ folder would otherwise make Ruff treat the alembic package as our own.
[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
